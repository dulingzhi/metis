[package]
name = "metis-gui"
description = "Metis 桌面控制台装配层（库；由 metis 单可执行文件调用）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "metis_gui"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
metis-core = { workspace = true }
metis-engine = { workspace = true }
metis-paths = { workspace = true }
metis-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
