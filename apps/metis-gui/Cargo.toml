[package]
name = "metis-gui"
description = "Metis 桌面控制台（eframe 壳）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "metis-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
metis-core = { workspace = true }
metis-engine = { workspace = true }
metis-paths = { workspace = true }
metis-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }
